name: Vercel Quota Recovery

on:
  schedule:
    # The latest quota refusal occurred at 17:37 UTC on 25/08/2026 and Vercel
    # explicitly asked to try again in 24 hours. 18:45 UTC gives the rolling
    # window more than 25 hours to clear instead of retrying on the boundary.
    - cron: "45 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Dispatch production even if the last status is not quota-related"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: vercel-quota-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Recover quota-limited production
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect latest main deployment status
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RECOVERY: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main")"
          MAIN_SHA="$(printf '%s' "$MAIN_JSON" | jq -r '.commit.sha')"

          STATUS_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${MAIN_SHA}/statuses?per_page=100")"

          DEPLOY_STATUS="$(printf '%s' "$STATUS_JSON" | jq -c '[.[] | select(.context == "deployment/vercel-cli")][0] // null')"
          STATE="$(printf '%s' "$DEPLOY_STATUS" | jq -r 'if . == null then "missing" else .state end')"
          DESCRIPTION="$(printf '%s' "$DEPLOY_STATUS" | jq -r 'if . == null then "no deployment status on current main" else (.description // "") end')"

          SHOULD_DISPATCH="false"
          if [ "${FORCE_RECOVERY:-false}" = "true" ]; then
            SHOULD_DISPATCH="true"
          elif [ "$STATE" = "missing" ]; then
            SHOULD_DISPATCH="true"
          elif [ "$STATE" = "failure" ] && printf '%s' "$DESCRIPTION" | grep -qi 'quota'; then
            SHOULD_DISPATCH="true"
          fi

          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "dispatch=$SHOULD_DISPATCH" >> "$GITHUB_OUTPUT"

          echo "Current main: $MAIN_SHA"
          echo "deployment/vercel-cli: $STATE - $DESCRIPTION"
          echo "Dispatch recovery: $SHOULD_DISPATCH"

      - name: Dispatch production workflow
        if: steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vercel-production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Production recovery dispatched for main."

      - name: Recovery summary
        shell: bash
        run: |
          {
            echo "### Vercel quota recovery"
            echo "- Main SHA: ${{ steps.gate.outputs.main_sha }}"
            echo "- Current deployment state: ${{ steps.gate.outputs.state }}"
            echo "- Current status: ${{ steps.gate.outputs.description }}"
            echo "- Recovery dispatched: ${{ steps.gate.outputs.dispatch }}"
          } >> "$GITHUB_STEP_SUMMARY"
