name: Vercel Production Deploy

on:
  workflow_run:
    workflows:
      - CI Build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Retry once per day, after the previous quota failure's rolling 24h window.
    # The provenance gate below makes this a no-op when production is current.
    - cron: "30 20 * * *"

permissions:
  contents: read
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: vercel-production-deploy
  # Only the newest CI-verified production commit is worth deploying.
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether production needs a deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      production_sha: ${{ steps.decide.outputs.production_sha }}
      expected_sha: ${{ steps.decide.outputs.expected_sha }}
    steps:
      - name: Resolve CI-verified source revision and production state
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PRODUCTION_PROVENANCE_URL: https://openai-ads.volponi.tech/provenance.json
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "production_sha=unchecked" >> "$GITHUB_OUTPUT"

            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "CI Build did not complete successfully; production deployment is blocked."
              exit 0
            fi

            COMMIT_MESSAGE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}" \
              | jq -r '.commit.message // ""')"

            if printf '%s' "$COMMIT_MESSAGE" | grep -Fq '[skip deploy]'; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "CI passed, but deploy was explicitly skipped by commit message."
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "CI passed for ${EXPECTED_SHA}; production deployment may proceed."
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            PRODUCTION_SHA="$(curl --fail --silent --show-error --max-time 15 "$PRODUCTION_PROVENANCE_URL" 2>/dev/null \
              | jq -r '.source_revision.commitSha // .sourceRevision.commitSha // empty' 2>/dev/null || true)"
            echo "production_sha=${PRODUCTION_SHA:-unknown}" >> "$GITHUB_OUTPUT"

            if [ -n "$PRODUCTION_SHA" ] && [ "$PRODUCTION_SHA" = "$EXPECTED_SHA" ]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Production already matches main (${EXPECTED_SHA}); scheduled retry is a no-op."
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Production is behind main or provenance could not prove equality; scheduled retry may proceed."
            exit 0
          fi

          echo "production_sha=unchecked" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "Manual execution explicitly requested for ${EXPECTED_SHA}."

  deploy:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    name: Build and deploy with Vercel CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.expected_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: adm-wuazecoms-projects
      VERCEL_PROJECT_NAME: openai-ads
      VERCEL_PRODUCTION_DOMAIN: openai-ads.volponi.tech
      VERCEL_DEPLOY_COOLDOWN_SECONDS: "60"
      INDEXNOW_KEY: "26b5fac8058e49e09141a6a4b7b6adc4"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout CI-verified source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.expected_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"deployment/vercel-cli\",\"description\":\"CI passed; GitHub Actions is building production\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Cooldown before Vercel API calls
        shell: bash
        run: |
          echo "Cooling down for ${VERCEL_DEPLOY_COOLDOWN_SECONDS}s before contacting Vercel..."
          sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Verify existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          vercel project inspect "$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" >/dev/null
          echo "Using existing Vercel project: ${VERCEL_SCOPE}/${VERCEL_PROJECT_NAME}"

      - name: Link repository to Vercel project
        shell: bash
        run: |
          set -euo pipefail
          vercel link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Try to enable Vercel Web Analytics
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ANALYTICS_OUTPUT="$(vercel project web-analytics \
            --scope="$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN" \
            --format json 2>&1)"
          ANALYTICS_EXIT=$?
          set -e

          printf '%s\n' "$ANALYTICS_OUTPUT"
          if [ "$ANALYTICS_EXIT" -ne 0 ]; then
            echo "::warning::Vercel CLI could not enable Web Analytics non-interactively. The @vercel/analytics integration remains in the app, and analytics activation must not block production."
          else
            echo "Vercel Web Analytics enablement confirmed."
          fi

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production artifact inside GitHub Actions
        env:
          PUBLIC_GIT_COMMIT_SHA: ${{ needs.gate.outputs.expected_sha }}
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Cooldown before production deploy
        shell: bash
        run: |
          echo "Cooling down for ${VERCEL_DEPLOY_COOLDOWN_SECONDS}s before deploy..."
          sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          set -uo pipefail
          set +e
          DEPLOY_OUTPUT="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" 2>&1)"
          DEPLOY_EXIT=$?
          set -e

          printf '%s\n' "$DEPLOY_OUTPUT"

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            if printf '%s\n' "$DEPLOY_OUTPUT" | grep -q 'api-deployments-free-per-day'; then
              echo "quota_limited=true" >> "$GITHUB_OUTPUT"
              echo "::error::Vercel Hobby daily API deployment quota is exhausted. The production artifact built successfully, but Vercel rejected creation of a new deployment."
            fi
            exit "$DEPLOY_EXIT"
          fi

          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Vercel reported success but no deployment URL was found."
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Preserve prebuilt artifact when Hobby quota is exhausted
        if: failure() && steps.deploy.outputs.quota_limited == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt-${{ needs.gate.outputs.expected_sha }}
          path: |
            .vercel/output
            .vercel/project.json
          if-no-files-found: error
          retention-days: 2

      - name: Verify source revision before production promotion
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_GIT_COMMIT_SHA: ${{ needs.gate.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .authority-attestation
          vercel curl /evidence.json --deployment "$DEPLOYMENT_URL" > .authority-attestation/evidence.json
          vercel curl /provenance.json --deployment "$DEPLOYMENT_URL" > .authority-attestation/provenance.json

          jq -e --arg sha "$EXPECTED_GIT_COMMIT_SHA" \
            '.schemaVersion == 2 and .sourceRevision.commitSha == $sha and .sourceRevision.commitUrl == ("https://github.com/LorenzaVolponi/openai-ads/commit/" + $sha)' \
            .authority-attestation/evidence.json >/dev/null

          jq -e --arg sha "$EXPECTED_GIT_COMMIT_SHA" \
            '.schema_version == "1.4" and .source_revision.commitSha == $sha and .source_revision.commitUrl == ("https://github.com/LorenzaVolponi/openai-ads/commit/" + $sha)' \
            .authority-attestation/provenance.json >/dev/null

          echo "Source revision verified before production promotion: ${EXPECTED_GIT_COMMIT_SHA}"

      - name: Attach production domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel alias set "$DEPLOYMENT_URL" "$VERCEL_PRODUCTION_DOMAIN" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          echo "Production alias: https://${VERCEL_PRODUCTION_DOMAIN}"

      - name: Verify production deployment and homepage
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          vercel inspect "$DEPLOYMENT_URL" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          vercel curl / --deployment "$DEPLOYMENT_URL" > /tmp/openai-ads-home.html

          test -s /tmp/openai-ads-home.html
          HOME_BYTES="$(wc -c < /tmp/openai-ads-home.html | tr -d ' ')"
          if [ "$HOME_BYTES" -lt 1000 ]; then
            echo "::error::Production homepage returned an unexpectedly small response (${HOME_BYTES} bytes)."
            exit 1
          fi

          echo "Production homepage health check passed (${HOME_BYTES} bytes)."

      - name: Attest deployed authority artifacts with GitHub
        id: authority_attestation
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: |
            .authority-attestation/evidence.json
            .authority-attestation/provenance.json

      - name: Verify GitHub authority attestation
        id: verify_authority_attestation
        if: steps.authority_attestation.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify .authority-attestation/evidence.json -R "$GITHUB_REPOSITORY"
          gh attestation verify .authority-attestation/provenance.json -R "$GITHUB_REPOSITORY"
          echo "GitHub artifact attestation verified for deployed authority artifacts."

      - name: Report authority attestation warning
        if: steps.authority_attestation.outcome == 'failure' || steps.verify_authority_attestation.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::GitHub artifact attestation was unavailable or could not be verified. Source-revision promotion checks already passed, so production remains healthy."

      - name: Notify IndexNow of published authority URLs
        if: success() && steps.deploy.outputs.url != ''
        shell: bash
        run: |
          set -uo pipefail
          INDEXNOW_ENDPOINT="https://api.indexnow.org/indexnow"
          KEY_LOCATION="https://${VERCEL_PRODUCTION_DOMAIN}/${INDEXNOW_KEY}.txt"

          cat > /tmp/indexnow.json <<JSON
          {
            "host": "${VERCEL_PRODUCTION_DOMAIN}",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "${KEY_LOCATION}",
            "urlList": [
              "https://${VERCEL_PRODUCTION_DOMAIN}/",
              "https://${VERCEL_PRODUCTION_DOMAIN}/radar",
              "https://${VERCEL_PRODUCTION_DOMAIN}/radar/ads-manager-nine-markets",
              "https://${VERCEL_PRODUCTION_DOMAIN}/radar/chatgpt-ads-europe-31-markets",
              "https://${VERCEL_PRODUCTION_DOMAIN}/radar/chatgpt-ads-brasil-launch",
              "https://${VERCEL_PRODUCTION_DOMAIN}/como-anunciar-no-chatgpt",
              "https://${VERCEL_PRODUCTION_DOMAIN}/chatgpt-ads-brasil",
              "https://${VERCEL_PRODUCTION_DOMAIN}/chatgpt-ads-precos",
              "https://${VERCEL_PRODUCTION_DOMAIN}/chatgpt-ads-metricas",
              "https://${VERCEL_PRODUCTION_DOMAIN}/ads-manager-chatgpt",
              "https://${VERCEL_PRODUCTION_DOMAIN}/chatgpt-ads-privacidade",
              "https://${VERCEL_PRODUCTION_DOMAIN}/imprensa",
              "https://${VERCEL_PRODUCTION_DOMAIN}/metodologia",
              "https://${VERCEL_PRODUCTION_DOMAIN}/feed.xml",
              "https://${VERCEL_PRODUCTION_DOMAIN}/feed.json",
              "https://${VERCEL_PRODUCTION_DOMAIN}/provenance.json"
            ]
          }
          JSON

          HTTP_CODE="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            "$INDEXNOW_ENDPOINT" || true)"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "IndexNow accepted the published URL batch (HTTP ${HTTP_CODE})."
          else
            echo "::warning::IndexNow notification did not return 200/202 (HTTP ${HTTP_CODE:-network-error}). Production remains healthy."
            cat /tmp/indexnow-response.txt 2>/dev/null || true
          fi

      - name: Mark deployment success
        if: success() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deployment/vercel-cli\",\"description\":\"Production deployed and verified\",\"target_url\":\"https://${VERCEL_PRODUCTION_DOMAIN}\"}"

      - name: Mark deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUOTA_LIMITED: ${{ steps.deploy.outputs.quota_limited }}
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTION="Vercel CLI production deploy failed"
          if [ "${QUOTA_LIMITED:-}" = "true" ]; then
            DESCRIPTION="Vercel Hobby daily deploy quota exhausted"
          fi
          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deployment/vercel-cli\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

      - name: Publish production URLs
        if: steps.deploy.outputs.url != ''
        run: |
          echo "Vercel deployment URL -> ${{ steps.deploy.outputs.url }}"
          echo "Production domain -> https://${VERCEL_PRODUCTION_DOMAIN}"
          echo "Source revision -> ${DEPLOY_SHA}"
          echo "GitHub authority attestation -> ${{ steps.authority_attestation.outputs.attestation-url }}"
