name: Vercel Production Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.head_ref == 'ops/run-production-now'
    name: Build and deploy with Vercel CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: adm-wuazecoms-projects
      VERCEL_PROJECT_NAME: openai-ads
      VERCEL_DEPLOY_COOLDOWN_SECONDS: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Cooldown before Vercel API calls
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sleep 10
          else
            sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"
          fi

      - name: Verify existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          vercel project inspect "$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" >/dev/null
          echo "Using existing Vercel project: ${VERCEL_SCOPE}/${VERCEL_PROJECT_NAME}"

      - name: Link repository to Vercel project
        shell: bash
        run: |
          set -euo pipefail
          vercel link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Find reusable READY deployments
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          echo "READY deployments for ${VERCEL_SCOPE}/${VERCEL_PROJECT_NAME}:"
          vercel list "$VERCEL_PROJECT_NAME" --status READY --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Pull Vercel production configuration
        if: github.event_name != 'pull_request'
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production artifact inside GitHub Actions
        if: github.event_name != 'pull_request'
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Cooldown before production deploy
        if: github.event_name != 'pull_request'
        shell: bash
        run: sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Deploy prebuilt artifact to production
        if: github.event_name != 'pull_request'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Mark deployment success
        if: github.event_name != 'pull_request' && success() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"deployment/vercel-cli\",\"description\":\"Production deployed by GitHub Actions\",\"target_url\":\"${DEPLOYMENT_URL}\"}"

      - name: Mark deployment failure
        if: github.event_name != 'pull_request' && failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"failure\",\"context\":\"deployment/vercel-cli\",\"description\":\"Vercel CLI production deploy failed\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

      - name: Post-deploy cooldown
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Publish deployment URL
        if: github.event_name != 'pull_request' && steps.deploy.outputs.url != ''
        run: echo "Vercel production URL -> ${{ steps.deploy.outputs.url }}"
