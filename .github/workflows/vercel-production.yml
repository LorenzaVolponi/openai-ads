name: Vercel Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy with Vercel CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: brainzilian-gmailcoms-projects
      VERCEL_PROJECT_NAME: openai-ads
      VERCEL_DEPLOY_COOLDOWN_SECONDS: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Cooldown before Vercel API calls
        shell: bash
        run: |
          echo "Cooling down for ${VERCEL_DEPLOY_COOLDOWN_SECONDS}s before contacting Vercel..."
          sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if vercel project inspect "$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "Vercel project '$VERCEL_PROJECT_NAME' already exists."
          else
            echo "Creating Vercel project '$VERCEL_PROJECT_NAME'..."
            vercel project add "$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          fi

      - name: Link repository to Vercel project
        shell: bash
        run: |
          set -euo pipefail
          vercel link --yes --project="$VERCEL_PROJECT_NAME" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production artifact locally
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Cooldown before production deploy
        shell: bash
        run: |
          echo "Cooling down for ${VERCEL_DEPLOY_COOLDOWN_SECONDS}s before deploy..."
          sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOYMENT_URL"

      - name: Post-deploy cooldown
        if: always()
        shell: bash
        run: |
          echo "Keeping the production deploy lane quiet for ${VERCEL_DEPLOY_COOLDOWN_SECONDS}s..."
          sleep "${VERCEL_DEPLOY_COOLDOWN_SECONDS}"

      - name: Publish deployment URL
        if: steps.deploy.outputs.url != ''
        run: echo "Vercel production URL -> ${{ steps.deploy.outputs.url }}"
