name: CI Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality, security and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Validate source watcher syntax
        run: node --check scripts/watch-official-sources.mjs

      - name: Validate SEO health checker syntax
        run: node --check scripts/seo-health-check.mjs

      - name: Validate intelligence health checker syntax
        run: node --check scripts/intelligence-health-check.mjs

      - name: Validate OAI readiness checker syntax
        run: node --check scripts/oai-readiness-check.mjs

      - name: Validate evidence health checker syntax
        run: node --check scripts/evidence-health-check.mjs

      - name: Validate media authority health checker syntax
        run: node --check scripts/media-authority-health-check.mjs

      - name: Validate OpenAI crawler health checker syntax
        run: node --check scripts/openai-crawler-health-check.mjs

      - name: Validate SEO insights syntax
        run: node --check scripts/seo-authority-insights.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Next.js application
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Smoke-test OAI, intelligence and social images locally
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/openai-ads-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT

          READY="false"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/oai-readiness >/dev/null 2>&1; then
              READY="true"
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Local Next.js server did not become ready."
            cat /tmp/openai-ads-next.log || true
            exit 1
          fi

          assert_image_route() {
            NAME="$1"
            URL="$2"
            HEADERS="/tmp/${NAME}.headers"
            OUTPUT="/tmp/${NAME}.bin"

            set +e
            HTTP_CODE="$(curl --silent --show-error --location \
              -D "$HEADERS" \
              -o "$OUTPUT" \
              -w '%{http_code}' \
              "$URL")"
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
              echo "::error::${NAME} image request failed (curl ${CURL_EXIT}, HTTP ${HTTP_CODE:-unknown})."
              cat "$HEADERS" 2>/dev/null || true
              echo "----- Next.js server log -----"
              cat /tmp/openai-ads-next.log || true
              exit 1
            fi

            if ! grep -Eiq '^content-type:[[:space:]]*image/' "$HEADERS"; then
              echo "::error::${NAME} did not return an image content type."
              cat "$HEADERS" || true
              exit 1
            fi

            IMAGE_BYTES="$(wc -c < "$OUTPUT" | tr -d ' ')"
            if [ "$IMAGE_BYTES" -lt 1000 ]; then
              echo "::error::${NAME} image was unexpectedly small (${IMAGE_BYTES} bytes)."
              exit 1
            fi

            echo "${NAME} image smoke passed (${IMAGE_BYTES} bytes)."
          }

          assert_image_route "authority-home-first" "http://127.0.0.1:3000/og/home"
          assert_image_route "authority-home-second" "http://127.0.0.1:3000/og/home"

          for slug in \
            ads-manager-nine-markets \
            chatgpt-ads-europe-31-markets \
            chatgpt-ads-brasil-launch \
            brazil-expansion-announced \
            ads-manager-cpc-measurement \
            canada-australia-new-zealand-expansion \
            us-pilot-starts; do
            assert_image_route \
              "radar-${slug}" \
              "http://127.0.0.1:3000/og/radar-${slug}"
          done

          assert_image_route \
            "radar-legacy-redirect" \
            "http://127.0.0.1:3000/og/radar/ads-manager-nine-markets?ratio=1x1"

          npm run oai:readiness -- http://127.0.0.1:3000
          npm run intelligence:health -- http://127.0.0.1:3000
