name: Runtime Quality Health

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "lighthouserc.json"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/runtime-quality-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-accessibility:
    name: Browser and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run browser and axe checks
        run: npm run test:e2e

      - name: Preserve Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  performance-budget:
    name: Lighthouse performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI budgets
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run quality:lighthouse

      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results-${{ github.sha }}
          path: .lighthouseci/results
          if-no-files-found: ignore
          retention-days: 7
