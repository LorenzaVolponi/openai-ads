name: SEO Authority Health

on:
  schedule:
    # Runs after the normal source-watch/recovery window so it inspects the
    # canonical production state rather than a deployment in flight.
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-authority-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify canonical SEO/GEO invariants
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check production SEO authority
        id: seo
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/seo-health-check.mjs https://openai-ads.volponi.tech 2>&1 | tee /tmp/seo-health.log

      - name: Open or refresh SEO regression issue
        if: steps.seo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SEO authority health regression"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          LOG_TAIL="$(tail -n 80 /tmp/seo-health.log 2>/dev/null || true)"
          BODY_FILE="/tmp/seo-issue.md"

          cat > "$BODY_FILE" <<EOF
          ## SEO authority health regression

          The automated production invariants found a canonical SEO/GEO regression.

          - Production: https://openai-ads.volponi.tech
          - Workflow run: ${RUN_URL}
          - Checked commit: ${GITHUB_SHA}
          - Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          ### Latest check output

          \`\`\`
          ${LOG_TAIL}
          \`\`\`

          This issue is maintained automatically. It will be closed after a clean production check.
          EOF

          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            echo "Updated SEO regression issue #${ISSUE_NUMBER}."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Close resolved SEO regression issue
        if: steps.seo.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SEO authority health regression"
          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Production SEO authority checks are green again. Closing automatically."
          fi

      - name: Publish SEO health summary
        if: always()
        shell: bash
        run: |
          {
            echo "### SEO authority health"
            echo "- Production: https://openai-ads.volponi.tech"
            echo "- Result: ${{ steps.seo.outcome }}"
            echo "- Checks: canonical pages, permanent aliases, machine-only noindex, robots, sitemap, OG and knowledge-graph aliases"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when SEO invariants fail
        if: steps.seo.outcome == 'failure'
        run: exit 1
