name: SEO Authority Health

on:
  workflow_run:
    workflows:
      - Vercel Production Deploy
    types:
      - completed
  schedule:
    # Daily backstop. Checks only compare production against main after the
    # exact source commit has a verified successful Vercel CLI deployment.
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: read

concurrency:
  group: seo-authority-health
  cancel-in-progress: true

jobs:
  health:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify SEO/GEO, evidence, media and crawler invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout authority expectations
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve production revision gate
        id: deployment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD)"
          STATUS_JSON="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/statuses?per_page=100")"
          DEPLOY_STATUS="$(printf '%s' "$STATUS_JSON" | jq -c '[.[] | select(.context == "deployment/vercel-cli")][0] // null')"
          STATE="$(printf '%s' "$DEPLOY_STATUS" | jq -r 'if . == null then "missing" else .state end')"
          DESCRIPTION="$(printf '%s' "$DEPLOY_STATUS" | jq -r 'if . == null then "no successful deployment status on expected source commit" else (.description // "") end')"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "Production revision gate: $STATE - $DESCRIPTION"

      - name: Check production SEO authority
        id: seo
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.state == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/seo-health-check.mjs https://openai-ads.volponi.tech 2>&1 | tee /tmp/seo-health.log

      - name: Check evidence ledger integrity and source revision
        id: evidence
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.state == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          EXPECTED_GIT_COMMIT_SHA="$(git rev-parse HEAD)" \
            node scripts/evidence-health-check.mjs https://openai-ads.volponi.tech 2>&1 | tee /tmp/evidence-health.log

      - name: Check media authority and news discovery
        id: media
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.state == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/media-authority-health-check.mjs https://openai-ads.volponi.tech 2>&1 | tee /tmp/media-authority-health.log

      - name: Check OpenAI crawler access
        id: crawlers
        if: github.event_name == 'workflow_dispatch' || steps.deployment.outputs.state == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/openai-crawler-health-check.mjs https://openai-ads.volponi.tech 2>&1 | tee /tmp/openai-crawler-health.log

      - name: Note deferred production check
        if: github.event_name != 'workflow_dispatch' && steps.deployment.outputs.state != 'success'
        shell: bash
        run: |
          {
            echo "### SEO authority health deferred"
            echo "- Production was not compared with the expected source commit because that exact commit is not marked as successfully deployed."
            echo "- Expected source commit: $(git rev-parse HEAD)"
            echo "- Deployment state: ${{ steps.deployment.outputs.state }}"
            echo "- Deployment status: ${{ steps.deployment.outputs.description }}"
            echo "- A skipped, quota-blocked or still-pending deployment is deployment lag, not an SEO regression."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh authority regression issue
        if: steps.seo.outcome == 'failure' || steps.evidence.outcome == 'failure' || steps.media.outcome == 'failure' || steps.crawlers.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SEO authority health regression"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SEO_LOG_TAIL="$(tail -n 50 /tmp/seo-health.log 2>/dev/null || true)"
          EVIDENCE_LOG_TAIL="$(tail -n 50 /tmp/evidence-health.log 2>/dev/null || true)"
          MEDIA_LOG_TAIL="$(tail -n 50 /tmp/media-authority-health.log 2>/dev/null || true)"
          CRAWLER_LOG_TAIL="$(tail -n 50 /tmp/openai-crawler-health.log 2>/dev/null || true)"
          BODY_FILE="/tmp/seo-issue.md"

          cat > "$BODY_FILE" <<EOF
          ## SEO / evidence / media / crawler authority regression

          The automated production invariants found a canonical SEO/GEO, evidence-ledger, source-revision, media-authority or OpenAI-crawler regression.

          - Production: https://openai-ads.volponi.tech
          - Workflow run: ${RUN_URL}
          - Expectations commit: $(git rev-parse HEAD)
          - Detected at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - SEO result: ${{ steps.seo.outcome }}
          - Evidence result: ${{ steps.evidence.outcome }}
          - Media authority result: ${{ steps.media.outcome }}
          - OpenAI crawler result: ${{ steps.crawlers.outcome }}

          ### SEO check output

          \`\`\`
          ${SEO_LOG_TAIL}
          \`\`\`

          ### Evidence ledger output

          \`\`\`
          ${EVIDENCE_LOG_TAIL}
          \`\`\`

          ### Media authority output

          \`\`\`
          ${MEDIA_LOG_TAIL}
          \`\`\`

          ### OpenAI crawler output

          \`\`\`
          ${CRAWLER_LOG_TAIL}
          \`\`\`

          This issue is maintained automatically. It will be closed after all production checks are clean.
          EOF

          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            echo "Updated authority regression issue #${ISSUE_NUMBER}."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Close resolved authority regression issue
        if: steps.seo.outcome == 'success' && steps.evidence.outcome == 'success' && steps.media.outcome == 'success' && steps.crawlers.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SEO authority health regression"
          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Production SEO authority, evidence-ledger, source-revision, media-authority and OpenAI-crawler checks are green again. Closing automatically."
          fi

      - name: Publish authority health summary
        if: always() && (steps.seo.outcome != 'skipped' || steps.evidence.outcome != 'skipped' || steps.media.outcome != 'skipped' || steps.crawlers.outcome != 'skipped')
        shell: bash
        run: |
          {
            echo "### SEO / evidence / media / crawler authority health"
            echo "- Production: https://openai-ads.volponi.tech"
            echo "- Expected source commit: $(git rev-parse HEAD)"
            echo "- SEO result: ${{ steps.seo.outcome }}"
            echo "- Evidence result: ${{ steps.evidence.outcome }}"
            echo "- Media authority result: ${{ steps.media.outcome }}"
            echo "- OpenAI crawler result: ${{ steps.crawlers.outcome }}"
            echo "- SEO checks: canonicals, aliases, machine noindex, freshness headers, robots, sitemap, OG, entity aliases and machine crawler semantics"
            echo "- Evidence checks: source Git revision, X-Source-Commit, SHA-256 record hashes, chain links, root hash, OpenAI primary-source hosts and proof caveats"
            echo "- Media checks: press ProfilePage, press kit, NewsArticle linkage, temporal news sitemap and multi-ratio article images"
            echo "- Crawler checks: explicit robots allowance and real HTTP access for OAI-SearchBot, OAI-AdsBot and the separate GPTBot policy"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when authority invariants fail
        if: steps.seo.outcome == 'failure' || steps.evidence.outcome == 'failure' || steps.media.outcome == 'failure' || steps.crawlers.outcome == 'failure'
        run: exit 1
