name: Semantic Discovery Health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run identity:health
      - run: npm run typecheck
      - run: npm run build
      - name: Start app
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/semantic-discovery.log 2>&1 &
          echo $! > /tmp/semantic-discovery.pid
      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/semantic-map.json >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/semantic-discovery.log
          exit 1
      - run: npm run seo:semantic
